name: Python and Node regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    name: ${{ matrix.os }} Python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Python regression suite
        run: python -m unittest discover -s tests -v
      - name: Python syntax compilation
        run: python -m compileall -q jarvis_core prototypes tests eval
      - name: Node regression suite
        run: node --test tests/*.test.mjs
      - name: Dashboard JavaScript syntax
        run: node --check prototypes/m03_b1/app.js
